name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned app
        run: |
          set -e
          xcodebuild \
            -project PlavuchestQuiz.xcodeproj \
            -scheme PlavuchestQuiz \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PlavuchestQuiz.app Payload/
          zip -qry PlavuchestQuiz-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlavuchestQuiz-unsigned
          path: PlavuchestQuiz-unsigned.ipa
          if-no-files-found: error
